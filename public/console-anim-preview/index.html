<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>console stall - animation candidates</title>
<style>
  body { background: #0b0d10; color: #cfd3d8; font: 13px/1.5 monospace; margin: 0; padding: 20px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  button { background: #1c2127; color: #cfd3d8; border: 1px solid #3a3f47; font: inherit; padding: 4px 12px; cursor: pointer; margin-right: 6px; }
  button.on { border-color: #37f7e0; color: #37f7e0; }
  #stage { position: relative; width: 487px; height: 530px; margin-top: 14px;
    background: repeating-conic-gradient(#20242b 0% 25%, #171a20 0% 50%) 0 0 / 16px 16px; }
  #stage img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
</style>
</head>
<body>
<h1>console stall - idle + hover candidates (plate + fx + char)</h1>
<div>
  <button id="bIdle" class="on">idle</button>
  <button id="bA">hover A (wave)</button>
  <button id="bB">hover B (peace)</button>
</div>
<div id="stage"></div>
<script>
const stage = document.getElementById('stage')
const layers = {}
const FILES = ['plate','fx-crt-f1','fx-crt-f2','fx-crt-f3','char-f1','char-f2','char-f3',
  'char-a1','char-a2','char-a3','char-a4','char-b1','char-b2','char-b3','char-b4']
for (const f of FILES) {
  const img = document.createElement('img')
  img.src = f + '.png'
  img.style.opacity = f === 'plate' ? 1 : 0
  img.onerror = () => { img.dataset.missing = '1' }
  stage.appendChild(img)
  layers[f] = img
}
let mode = 'idle'
const show = (name, group) => {
  for (const f of FILES) {
    if (!f.startsWith(group)) continue
    layers[f].style.opacity = f === name ? 1 : 0
  }
}
let fxI = 0
setInterval(() => { fxI = (fxI + 1) % 3; show('fx-crt-f' + (fxI + 1), 'fx-crt') }, 220)
let idleI = 0
const IDLE = ['char-f1', 'char-f1', 'char-f2', 'char-f3']
const IDLE_MS = [1400, 180, 900, 180]
let idleTimer = null
const idleTick = () => {
  if (mode !== 'idle') return
  show(IDLE[idleI], 'char')
  idleTimer = setTimeout(() => { idleI = (idleI + 1) % IDLE.length; idleTick() }, IDLE_MS[idleI])
}
const hover = (set) => {
  clearTimeout(idleTimer)
  const frames = [1, 2, 3, 4]
    .map((n) => 'char-' + set + n)
    .filter((f) => !layers[f].dataset.missing)
  if (!frames.length) { show('char-f1', 'char'); return }
  let i = 0
  const step = () => {
    if (mode !== set) return
    show(frames[Math.min(i, frames.length - 1)], 'char')
    if (i < frames.length - 1) { i++; setTimeout(step, 150) }
  }
  step()
}
const setMode = (m) => {
  mode = m
  document.querySelectorAll('button').forEach((b) => b.classList.remove('on'))
  document.getElementById(m === 'idle' ? 'bIdle' : m === 'a' ? 'bA' : 'bB').classList.add('on')
  if (m === 'idle') { idleI = 0; idleTick() } else hover(m)
}
document.getElementById('bIdle').onclick = () => setMode('idle')
document.getElementById('bA').onclick = () => setMode('a')
document.getElementById('bB').onclick = () => setMode('b')
idleTick()
</script>
</body>
</html>
