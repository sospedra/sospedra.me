<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Which key code? ▼ sospedra.me</title>
    <meta name="description" content="Which keys map to what keyboard code?" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Which key code?" />
    <meta
      name="twitter:description"
      content="Which keys map to what keyboard code?"
    />
    <meta name="twitter:creator" content="@sospedra_r" />
    <meta
      name="twitter:image"
      content="https://user-images.githubusercontent.com/3116899/88484061-315fc900-cf6c-11ea-9d94-d3b24dd6d1e9.png"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body class="h-screen w-full">
    <main
      class="container mx-auto p-4 h-full flex flex-col justify-between items-center"
    >
      <div class="flex flex-col flex-1 justify-center items-center w-full">
        <div class="h-64 w-full flex flex-col justify-center items-center">
          <input
            readonly
            class="w-full text-6xl"
            id="js-which"
            value="Press any key"
          />
          <label for="js-which"><code>event.which</code></label>
        </div>
        <div class="flex flex-row flex-wrap">
          <div class="text-center flex flex-col items-center flex-1">
            <input id="js-key" class="text-2xl flex-1" value="--" readonly />
            <label class="inline-flex" for="js-key">
              <code>event.key</code>
            </label>
          </div>
          <div class="text-center flex flex-col items-center flex-1">
            <input id="js-code" class="text-2xl flex-1" value="--" readonly />
            <label class="inline-flex" for="js-code">
              <code>event.code</code>
            </label>
          </div>
        </div>
      </div>

      <aside id="js-toast" class="to-fade">Copied to your clipboard!</aside>

      <footer class="p-8">
        <nav class="w-full text-center">
          <a href="/codes">Raw codes</a>
          <span>▼</span>
          <a href="https://github.com/sospedra/which-key-code">GitHub</a>
        </nav>
        <p>
          Hand-crafted with
          <span class="mr-2" role="img" aria-label="purple heart">💜</span>
          by
          <a href="https://sospedra.me">@sospedra</a>
        </p>
      </footer>
    </main>
    <div class="granimate"></div>
  </body>
</html>
