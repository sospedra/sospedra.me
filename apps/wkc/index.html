<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Which key code? ▼ sospedra.me</title>
    <meta name="description" content="Which keys map to what keyboard code?" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Which key code?" />
    <meta
      name="twitter:description"
      content="Which keys map to what keyboard code?"
    />
    <meta name="twitter:creator" content="@sospedra_r" />
    <meta
      name="twitter:image"
      content="https://user-images.githubusercontent.com/3116899/88484061-315fc900-cf6c-11ea-9d94-d3b24dd6d1e9.png"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/favicon-512.png"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/DepartureMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <canvas id="js-wave" class="wave-canvas" aria-hidden="true"></canvas>

    <main class="frame">
      <header class="bezel">
        <span>which key code?<span class="caret"></span></span>
        <nav class="bezel-nav">
          <button id="js-sound" class="sound" type="button" aria-pressed="true">
            sound on
          </button>
          <a href="/codes">raw codes</a>
          <a href="https://github.com/sospedra/which-key-code">github</a>
        </nav>
      </header>

      <section class="stage">
        <input readonly id="js-code" class="glyph is-idle" value="Press any key" />
        <label for="js-code" class="glyph-label"><code>event.code</code></label>
        <p id="js-tune" class="tune">waiting for signal</p>
      </section>

      <section class="readouts">
        <div class="cell">
          <input readonly id="js-key" value="--" />
          <label for="js-key"><code>event.key</code></label>
        </div>
        <div class="cell">
          <input readonly id="js-which" value="--" />
          <label for="js-which">
            <code>event.which</code>
            <span class="tag">deprecated</span>
          </label>
        </div>
      </section>

      <section class="keys" aria-label="tap keyboard">
        <div id="js-keys" class="keys-grid"></div>
        <p class="keys-note">simulated presses · pair a keyboard for live events</p>
      </section>

      <aside id="js-toast" class="toast">Copied</aside>

      <footer class="credit">
        Hand-crafted with
        <span role="img" aria-label="purple heart">💜</span>
        by
        <a href="https://sospedra.me">@sospedra</a>
      </footer>
    </main>
  </body>
</html>
