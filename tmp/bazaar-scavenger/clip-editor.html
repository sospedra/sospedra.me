<!doctype html>
<meta charset="utf-8">
<title>scavenger clip editor — 400%</title>
<style>
  body { margin: 0; background: #161616; color: #ddd; font: 13px/1.6 monospace; }
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: #161616f0;
         border-bottom: 1px solid #444; padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; background: #2a2a2a; color: #ddd; border: 1px solid #555; border-radius: 3px; cursor: pointer; }
  button.on { background: #e08030; color: #111; }
  textarea { font: inherit; width: 480px; height: 34px; background: #222; color: #9c9; border: 1px solid #555; }
  #view { position: absolute; top: 54px; left: 0; right: 0; bottom: 0; overflow: scroll; }
  #world { position: relative; width: 6120px; height: 3884px; }
  #world img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #plate { opacity: 0.55; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .pt { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; background: #ff0080;
        border: 2px solid #fff; border-radius: 3px; cursor: grab; z-index: 5; }
  .pt.sel { background: #e08030; }
</style>
<div id="bar">
  <span>clip editor · 400% · drag points</span>
  <span id="frames"></span>
  <button id="add">ADD</button>
  <button id="del">DEL</button>
  <button id="copy">COPY</button>
  <button id="reset">RESET</button>
  <textarea id="css" readonly onclick="this.select()"></textarea>
</div>
<div id="view">
  <div id="world">
    <img id="plate" src="file:///Users/sospedra/labs/sospedra.me/apps/main/public/images/bazaar/scavenger/plate-key.png" alt="">
    <img id="sprite" src="file:///Users/sospedra/labs/sospedra.me/apps/main/public/images/bazaar/scavenger/char-h6.png" alt="">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none"><polygon id="poly" fill="none" stroke="#ff0080" stroke-width="0.12"></polygon></svg>
  </div>
</div>
<script>
  const SHIPPED = [[0,0],[100,0],[100,56.13],[46.73,56.13],[46.73,60.25],[42.81,60.25],[42.81,56.13],[0,56.13]];
  let points = SHIPPED.map(p => p.slice());
  let selected = 3;
  let dragging = null;
  const world = document.getElementById('world');
  const sprite = document.getElementById('sprite');
  const poly = document.getElementById('poly');
  const cssBox = document.getElementById('css');

  const toCss = () => 'polygon(' + points.map(p => p[0].toFixed(2) + '% ' + p[1].toFixed(2) + '%').join(', ') + ')';

  function render() {
    for (const el of world.querySelectorAll('.pt')) el.remove();
    points.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'pt' + (i === selected ? ' sel' : '');
      el.style.left = p[0] + '%';
      el.style.top = p[1] + '%';
      el.onpointerdown = (e) => { e.preventDefault(); dragging = i; selected = i; render(); };
      world.appendChild(el);
    });
    poly.setAttribute('points', points.map(p => p[0] + ',' + p[1]).join(' '));
    sprite.style.clipPath = toCss();
    cssBox.value = toCss();
  }

  window.addEventListener('pointermove', (e) => {
    if (dragging === null) return;
    const r = world.getBoundingClientRect();
    points[dragging] = [
      Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100)),
      Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100)),
    ];
    render();
  });
  window.addEventListener('pointerup', () => { dragging = null; });

  document.getElementById('add').onclick = () => {
    const next = (selected + 1) % points.length;
    points.splice(selected + 1, 0, [
      (points[selected][0] + points[next][0]) / 2,
      (points[selected][1] + points[next][1]) / 2,
    ]);
    selected += 1;
    render();
  };
  document.getElementById('del').onclick = () => {
    if (points.length <= 3) return;
    points.splice(selected, 1);
    selected = 0;
    render();
  };
  document.getElementById('copy').onclick = () => {
    cssBox.select();
    document.execCommand('copy');
    navigator.clipboard?.writeText(toCss()).catch(() => {});
  };
  document.getElementById('reset').onclick = () => { points = SHIPPED.map(p => p.slice()); selected = 3; render(); };

  const bar = document.getElementById('frames');
  for (const f of ['char-idle.png','char-h1.png','char-h2.png','char-h3.png','char-h4.png','char-h5.png','char-h6.png']) {
    const b = document.createElement('button');
    b.textContent = f.replace('char-','').replace('.png','');
    if (f === 'char-h6.png') b.className = 'on';
    b.onclick = () => {
      sprite.src = 'file:///Users/sospedra/labs/sospedra.me/apps/main/public/images/bazaar/scavenger/' + f;
      for (const x of bar.children) x.className = '';
      b.className = 'on';
    };
    bar.appendChild(b);
  }
  render();
  document.getElementById('view').scrollTo(667 * 4 - 300, 288 * 4 - 200);
</script>
