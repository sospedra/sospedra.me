name: publish-sti

on:
  push:
    branches: [main]
    paths: ["packages/sti/**"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - name: compare against the published version
        id: guard
        run: |
          local=$(node -p "require('./packages/sti/package.json').version")
          remote=$(npm view @sospedra/sti version 2>/dev/null || echo none)
          echo "changed=$([ "$local" != "$remote" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: gates
        if: steps.guard.outputs.changed == 'true'
        run: |
          pnpm --filter @sospedra/sti run lint
          pnpm --filter @sospedra/sti run typecheck
          pnpm --filter @sospedra/sti run test
      - name: publish
        if: steps.guard.outputs.changed == 'true'
        run: pnpm --filter @sospedra/sti publish --no-git-checks
