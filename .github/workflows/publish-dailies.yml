name: Publish dailies

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dailies
  cancel-in-progress: false

jobs:
  publish:
    name: Generate, verify, and trigger deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the deployment branch
        uses: actions/checkout@v4

      - name: Resolve the UTC publication date
        run: |
          publication_date="$(date -u +%F)"
          echo "MERIDIAN_PUBLICATION_DATE=${publication_date}" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Archive the Spanish crossword
        continue-on-error: true
        run: pnpm --filter main ci:crosswords:archive-es

      - name: Verify the timed geography engine
        run: pnpm --filter main ci:geo:test

      - name: Generate and build the UTC edition
        run: pnpm --filter main build

      - name: Validate the generated edition and locked corpus
        run: pnpm --filter main ci:geo:validate:challenges

      - name: Commit the dailies and trigger the deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/main/repo/crosswords/challenges
          git commit --allow-empty -m "chore: publish dailies ${MERIDIAN_PUBLICATION_DATE}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
